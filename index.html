<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mix Promo Page</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <div class="container">
        <!-- Шапка сайта -->
        <header class="header clearfix">
            <div class="logo">Mix</div>
            <nav class="nav">
                <a href="#" class="nav-link">Product</a>
                <a href="#" class="nav-link">Pricing</a>
                <a href="#" class="nav-link">About Us</a>
                <a href="#" class="nav-link">Blog</a>
                <a href="#" class="nav-link">Help</a>
                <a href="#" class="nav-link">Log In</a>
                <a href="#" class="btn btn-nav">Create Account</a>
            </nav>
        </header>

        <!-- Основной блок (Hero section) -->
        <main class="hero clearfix">
            <div class="hero-text">
                <h1 class="main-title">
                    The world’s first<br>
                    learning solution<br>
                    for everyone
                </h1>
                <p class="description">
                    It is a long established fact that a reader will be distracted by the readable content of a page when looking at its layout. The point of using Lorem Ipsum.
                </p>
                <div class="actions clearfix">
                    <button class="btn btn-primary">Get Started</button>
                    <button class="btn btn-secondary">Create Account</button>
                </div>
            </div>
            
            <div class="hero-image">
                <img src="resources/clipart.jpg" alt="People on a video call illustration" class="illustration">
            </div>
        </main>
    </div>

</body>
</html>
